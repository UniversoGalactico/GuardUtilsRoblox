name: GuardUtils regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guardutils-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  luau:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-pinned official Luau 0.734
        run: |
          archive="$RUNNER_TEMP/luau-ubuntu.zip"
          curl --fail --location --retry 3 https://github.com/luau-lang/luau/releases/download/0.734/luau-ubuntu.zip --output "$archive"
          echo "3e514385267c6606f1ff6824bd9d21708a5dd272ea91ab7355a2743b20d45d45  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/luau"
          unzip -q "$archive" -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/luau" "$RUNNER_TEMP/luau/luau-analyze"
      - name: Regression and differential tests
        run: |
          for opt in 0 1 2; do
            python3 tests/run.py --luau "$RUNNER_TEMP/luau/luau" --optimization "$opt"
            python3 tests/run.py --luau "$RUNNER_TEMP/luau/luau" --stateful --optimization "$opt"
          done
      - name: Strict type analysis of production source
        run: python3 tests/typecheck.py --analyzer "$RUNNER_TEMP/luau/luau-analyze"
      - name: Comparative microbenchmarks (diagnostic)
        run: |
          git show 1117a32f0a1e33ff001d29c72c5a63da2264450f:GuardUtilsRoblox.lua > "$RUNNER_TEMP/guardutils-baseline.lua"
          echo "BASELINE 1117a32"
          python3 tests/run.py --luau "$RUNNER_TEMP/luau/luau" --benchmark --source "$RUNNER_TEMP/guardutils-baseline.lua"
          echo "CURRENT"
          python3 tests/run.py --luau "$RUNNER_TEMP/luau/luau" --benchmark

  publish-v3:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: luau
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Publish v3.0.0 once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! grep -Fq 'VERSION = "3.0.0"' GuardUtilsRoblox.lua; then exit 0; fi
          if gh release view v3.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v3.0.0 GuardUtilsRoblox.lua tests/studio_smoke.server.lua --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GuardUtils 3.0.0" --notes-file docs/RELEASE_3.0.0.md --latest
